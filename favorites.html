<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvoya</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/favorites.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="#">
          <img
            class="logo"
            src="images/Solvoya Travel Compass Logo.png"
            alt="Solvoya"
          />
        </a>
        <nav class="nav-links">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="hotels.html">Hotels</a></li>
            <li><a href="favorites.html" class="active">Favorites</a></li>
          </ul>
        </nav>
        <div class="actions">
          <a href="signin.html" class="signin-btn">Sign In</a>
          <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
      </div>
    </header>
    <section class="hero">
      <div class="container">
        <div class="text">
          <h1>My Favorites</h1>
          <p>Your saved destinations and hotels</p>
        </div>
      </div>
    </section>
    <section class="favorites-section">
      <div class="container">
        <div class="favorites-tabs">
          <button class="tab-btn active" data-tab="destinations">
            Destinations
          </button>
          <button class="tab-btn" data-tab="hotels">Hotels</button>
        </div>
        <div class="favorites-content">
          <div class="favorites-panel active" id="destinations-panel">
            <div class="destinations-grid" id="favorite-destinations"></div>
          </div>
          <div class="favorites-panel" id="hotels-panel">
            <div class="hotels-grid" id="favorite-hotels"></div>
          </div>
        </div>
      </div>
    </section>
    <script src="js/favorites.js"></script>
  </body>
</html>
