<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Solvoya</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/signin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card">
      <div class="image">
        <img src="images/Solvoya Travel Compass Logo.png" alt="" />
        <h1>Welcome <span>Back!</span></h1>
        <p>Sign in to continue your<br>journey around the world</p>
      </div>
      <div class="signin">
        <i class="fa-solid fa-plane"></i>
        <h2>Sign In</h2>
        <p>Welcome Back! Please sign in to your account.</p>
        <form action="#" method="post">
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
            />
          </div>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
              id="password"
            />
            <i class="fa-regular fa-eye password-eye" id="togglePassword"></i>
          </div>
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html"> Forgot password? </a>
          </div>
          <button type="submit">
            Sign In
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
        <div class="divider">
          <span>Or continue with</span>
        </div>
        <div class="social-buttons">
          <button type="button" class="social-btn">
            <img class="google-logo" src="images/google.png" alt="">
            Google
          </button>
          <button type="button" class="social-btn">
            <i class="fa-brands fa-apple"></i>
            Apple
          </button>
        </div>
        <p class="switch-page">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
